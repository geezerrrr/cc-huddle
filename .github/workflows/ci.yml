name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # Node and pnpm at the versions in mise.toml.
      - uses: jdx/mise-action@v5
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  # The oldest Node.js the README names, which your session may start cc-huddle's server with.
  test-oldest-node:
    runs-on: ubuntu-latest
    env:
      MISE_NODE_VERSION: 22.15.0
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: node --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # The mod's types (plugin/tsconfig.json) are written by an interactive Claude Code session, so CI lints all but the mod.
      - run: pnpm lint --ignore-pattern plugin/hooks
      - run: pnpm format:check
      - name: plugin/dist is built from the source
        run: |
          pnpm build
          if [ -n "$(git status --porcelain plugin/dist)" ]; then
            git status --short plugin/dist
            echo "::error::plugin/dist is out of date: run pnpm build and commit it"
            exit 1
          fi
      # The Claude Code the Agent SDK is built for, which cc-huddle needs at least, validates and tests the mod.
      - run: npm install --global "@anthropic-ai/claude-code@$(node -p "JSON.parse(require('fs').readFileSync('node_modules/@anthropic-ai/claude-agent-sdk/package.json')).claudeCodeVersion")"
      - run: pnpm check:mod
