name: Latest Claude Code

# The mod against the newest Claude Code, daily and on every push to main, so
# a change in Claude Code that breaks cc-huddle shows here before users meet it.
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-mod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: pnpm install --frozen-lockfile
      - run: npm install --global @anthropic-ai/claude-code@latest
      - run: claude --version
      - run: pnpm check:mod
